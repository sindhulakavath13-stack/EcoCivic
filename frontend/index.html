<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EcoCivic AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header>

        <h1>🌱 EcoCivic AI</h1>

        <p>
            AI-Powered Community Sustainability
            Grievance Analyzer
        </p>

    </header>


    <main>


        <!-- ============================= -->
        <!-- USER PROFILE SECTION -->
        <!-- ============================= -->

        <section id="userProfileSection">

            <div class="profile-header">

                <div class="profile-avatar">
                    👤
                </div>


                <div class="profile-info">

                    <h2>
                        My Profile
                    </h2>

                    <p id="profileName">
                        User
                    </p>

                    <p id="profileEmail">
                        Email
                    </p>

                </div>


                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>


            <!-- ============================= -->
            <!-- PROFILE STATISTICS -->
            <!-- ============================= -->

            <div class="profile-statistics">

                <h3>
                    My Complaint Statistics
                </h3>


                <div class="profile-stat-cards">


                    <div class="profile-stat-card">

                        <span
                            class="profile-stat-number"
                            id="profileTotalCount"
                        >
                            0
                        </span>

                        <span class="profile-stat-label">
                            Total Complaints
                        </span>

                    </div>


                    <div class="profile-stat-card">

                        <span
                            class="profile-stat-number"
                            id="profilePendingCount"
                        >
                            0
                        </span>

                        <span class="profile-stat-label">
                            Pending
                        </span>

                    </div>


                    <div class="profile-stat-card">

                        <span
                            class="profile-stat-number"
                            id="profileInProgressCount"
                        >
                            0
                        </span>

                        <span class="profile-stat-label">
                            In Progress
                        </span>

                    </div>


                    <div class="profile-stat-card">

                        <span
                            class="profile-stat-number"
                            id="profileResolvedCount"
                        >
                            0
                        </span>

                        <span class="profile-stat-label">
                            Resolved
                        </span>

                    </div>


                </div>

            </div>

        </section>


        <!-- ============================= -->
        <!-- COMPLAINT SUBMISSION -->
        <!-- ============================= -->

        <section class="complaint-box">

            <h2>
                Report a Sustainability Issue
            </h2>


            <form id="complaintForm">


                <label for="complaint">
                    Describe your complaint
                </label>


                <textarea
                    id="complaint"
                    placeholder="Example: Garbage has been dumped near our lake..."
                    required
                ></textarea>


                <label for="image">
                    Upload an image
                </label>


                <input
                    type="file"
                    id="image"
                    accept="image/*"
                >


                <label for="location">
                    Location
                </label>


                <input
                    type="text"
                    id="location"
                    placeholder="Enter your location"
                    required
                >


                <button type="submit">
                    Submit Complaint
                </button>


            </form>


            <div id="message"></div>

        </section>


        <!-- ============================= -->
        <!-- MY COMPLAINTS SECTION -->
        <!-- ============================= -->

        <section id="myComplaintsSection">

            <h2>

                My Complaints

                <span id="complaintCount">
                </span>

            </h2>


            <div id="myComplaintsList">

                Loading your complaints...

            </div>

        </section>


        <!-- ============================= -->
        <!-- COMPLAINT DETAILS MODAL -->
        <!-- ============================= -->

        <div
            id="complaintModal"
            class="complaint-modal"
        >

            <div
                class="complaint-modal-content"
            >

                <span
                    id="closeComplaintModal"
                    class="close-complaint-modal"
                >
                    &times;
                </span>


                <h2>
                    Complaint Details
                </h2>


                <div id="complaintDetails">
                </div>

            </div>

        </div>


    </main>


    <!-- ============================= -->
    <!-- MAIN COMPLAINT SUBMISSION JS -->
    <!-- ============================= -->

    <script src="config.js"></script>
    <script src="script.js"></script>


    <!-- ============================= -->
    <!-- MY COMPLAINTS JAVASCRIPT -->
    <!-- ============================= -->

    <script>


    // =====================================================
    // DISPLAY LOGGED-IN USER PROFILE
    // =====================================================

    const storedProfileUser =
        localStorage.getItem("loggedInUser");


    if (!storedProfileUser) {

        window.location.href =
            "login.html";

    } else {

        try {

            const profileUser =
                JSON.parse(
                    storedProfileUser
                );


            const profileName =
                document.getElementById(
                    "profileName"
                );


            const profileEmail =
                document.getElementById(
                    "profileEmail"
                );


            // =============================================
            // DISPLAY ACTUAL USER NAME
            // =============================================

            if (profileName) {

                profileName.textContent =
                    profileUser.name ||
                    profileUser.username ||
                    "User";

            }


            // =============================================
            // DISPLAY ACTUAL USER EMAIL
            // =============================================

            if (profileEmail) {

                profileEmail.textContent =
                    profileUser.email ||
                    "Email";

            }


        } catch (error) {

            console.error(
                "Unable to load user profile:",
                error
            );

            window.location.href =
                "login.html";

        }

    }



    // =====================================================
    // LOAD MY COMPLAINTS
    // =====================================================

    async function loadMyComplaints() {

        const storedUser =
            localStorage.getItem(
                "loggedInUser"
            );


        if (!storedUser) {

            window.location.href =
                "login.html";

            return;
        }


        const user =
            JSON.parse(
                storedUser
            );


        try {

            const response =
                await fetch(
                    `${CONFIG.API_BASE_URL}/reports/my?t=${Date.now()}`,
                    {
                        method: "GET",

                        cache: "no-store",

                        headers: {
                            "Authorization": `Bearer ${user.token}`,
                            "Cache-Control":
                                "no-cache",

                            "Pragma":
                                "no-cache"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load complaints"
                );

            }


            const complaints =
                await response.json();


            // =================================================
            // COMPLAINT COUNT
            // =================================================

            const complaintCount =
                document.getElementById(
                    "complaintCount"
                );


            if (complaintCount) {

                complaintCount.textContent =
                    ` (${complaints.length})`;

            }


            // =================================================
            // PROFILE COUNTS
            // =================================================

            const totalCount =
                document.getElementById(
                    "profileTotalCount"
                );


            const pendingCount =
                document.getElementById(
                    "profilePendingCount"
                );


            const inProgressCount =
                document.getElementById(
                    "profileInProgressCount"
                );


            const resolvedCount =
                document.getElementById(
                    "profileResolvedCount"
                );


            if (totalCount) {

                totalCount.textContent =
                    complaints.length;

            }


            if (pendingCount) {

                pendingCount.textContent =
                    complaints.filter(
                        c =>
                            c.status ===
                            "Pending"
                    ).length;

            }


            if (inProgressCount) {

                inProgressCount.textContent =
                    complaints.filter(
                        c =>
                            c.status ===
                            "In Progress"
                    ).length;

            }


            if (resolvedCount) {

                resolvedCount.textContent =
                    complaints.filter(
                        c =>
                            c.status ===
                            "Resolved"
                    ).length;

            }


            // =================================================
            // COMPLAINT LIST
            // =================================================

            const complaintsList =
                document.getElementById(
                    "myComplaintsList"
                );


            if (!complaintsList) {

                console.error(
                    "myComplaintsList not found"
                );

                return;

            }


            if (complaints.length === 0) {

                complaintsList.textContent =
                    "You have not submitted any complaints yet.";

                return;

            }


            complaintsList.innerHTML = "";


            // =================================================
            // CREATE COMPLAINT CARDS
            // =================================================

            complaints.forEach(
                function (complaint) {

                    const complaintItem =
                        document.createElement(
                            "div"
                        );


                    complaintItem.className =
                        "my-complaint-item";


                    // -----------------------------------------
                    // FORMAT TIMES
                    // -----------------------------------------

                    const createdDate =
                        new Date(
                            complaint.created_at
                        );


                    const updatedDate =
                        new Date(
                            complaint.updated_at
                        );


                    const submittedTime =
                        createdDate.toLocaleString(
                            "en-IN",
                            {
                                day: "2-digit",
                                month: "short",
                                year: "numeric",
                                hour: "2-digit",
                                minute: "2-digit",
                                second: "2-digit",
                                hour12: true
                            }
                        );


                    const updatedTime =
                        updatedDate.toLocaleString(
                            "en-IN",
                            {
                                day: "2-digit",
                                month: "short",
                                year: "numeric",
                                hour: "2-digit",
                                minute: "2-digit",
                                second: "2-digit",
                                hour12: true
                            }
                        );


                    // -----------------------------------------
                    // COMPLAINT HTML
                    // -----------------------------------------

                    complaintItem.innerHTML = `

                        <p>
                            <strong>
                                Complaint ID:
                            </strong>

                            ${complaint.id || complaint._id}
                        </p>


                        <p>
                            <strong>
                                Complaint:
                            </strong>

                            ${complaint.description || complaint.complaint}
                        </p>


                        <p>
                            <strong>
                                Category:
                            </strong>

                            ${complaint.category}
                        </p>


                        ${
                            complaint.image
                            ?
                            `
                            <p>
                                <strong>
                                    Image:
                                </strong>
                            </p>

                            <img
                                src="http://127.0.0.1:5000/uploads/${complaint.image}"
                                alt="Complaint Image"
                                class="complaint-image"
                            >
                            `
                            :
                            ""
                        }


                        <p>
                            <strong>
                                Priority:
                            </strong>

                            ${complaint.priority}
                        </p>


                        <p>
                            <strong>
                                Status:
                            </strong>

                            <span
                                class="complaint-status status-${complaint.status
                                    .toLowerCase()
                                    .replace(/\s+/g, "-")}"
                            >
                                ${complaint.status}
                            </span>
                        </p>


                        <p>
                            <strong>
                                Submitted:
                            </strong>

                            ${submittedTime}
                        </p>


                        <p>
                            <strong>
                                Last Updated:
                            </strong>

                            ${updatedTime}
                        </p>


                        <button
                            type="button"
                            class="view-details-btn"
                        >
                            View Details
                        </button>


                        <hr>

                    `;


                    // =================================================
                    // ATTACH VIEW DETAILS BUTTON
                    // =================================================

                    const viewButton =
                        complaintItem.querySelector(
                            ".view-details-btn"
                        );


                    if (viewButton) {

                        viewButton.addEventListener(
                            "click",
                            function () {

                                console.log(
                                    "View Details clicked:",
                                    complaint._id
                                );


                                showComplaintDetails(
                                    complaint
                                );

                            }
                        );

                    }


                    complaintsList.appendChild(
                        complaintItem
                    );

                }
            );


        } catch (error) {

            console.error(
                "Error loading my complaints:",
                error
            );


            const complaintsList =
                document.getElementById(
                    "myComplaintsList"
                );


            if (complaintsList) {

                complaintsList.textContent =
                    "Unable to load your complaints.";

            }

        }

    }



    // =====================================================
    // SHOW COMPLAINT DETAILS
    // =====================================================

    function showComplaintDetails(
        complaint
    ) {

        console.log(
            "Opening complaint details:",
            complaint
        );


        const complaintDetails =
            document.getElementById(
                "complaintDetails"
            );


        const complaintModal =
            document.getElementById(
                "complaintModal"
            );


        if (!complaintDetails) {

            console.error(
                "complaintDetails element not found"
            );

            return;

        }


        if (!complaintModal) {

            console.error(
                "complaintModal element not found"
            );

            return;

        }


        // =================================================
        // FORMAT TIMES
        // =================================================

        const createdDate =
            new Date(
                complaint.createdAt
            );


        const updatedDate =
            new Date(
                complaint.createdAt // Using createdAt as updated_at isn't available
            );


        const submittedTime =
            createdDate.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                }
            );


        const updatedTime =
            updatedDate.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                }
            );


        // =================================================
        // STATUS PROGRESS
        // Pending → AI Verified → In Progress → Resolved
        // =================================================

        const statusProgress = `

            <div class="status-progress">

                <div
                    class="status-step ${
                        complaint.status === "Pending" ||
                        complaint.status === "AI Verified" ||
                        complaint.status === "In Progress" ||
                        complaint.status === "Resolved"
                            ? "active"
                            : ""
                    }"
                >
                    Pending
                </div>


                <div class="status-line"></div>


                <div
                    class="status-step ${
                        complaint.status === "AI Verified" ||
                        complaint.status === "In Progress" ||
                        complaint.status === "Resolved"
                            ? "active"
                            : ""
                    }"
                >
                    AI Verified
                </div>


                <div class="status-line"></div>


                <div
                    class="status-step ${
                        complaint.status === "In Progress" ||
                        complaint.status === "Resolved"
                            ? "active"
                            : ""
                    }"
                >
                    In Progress
                </div>


                <div class="status-line"></div>


                <div
                    class="status-step ${
                        complaint.status === "Resolved"
                            ? "active"
                            : ""
                    }"
                >
                    Resolved
                </div>

            </div>

        `;


        // =================================================
        // MODAL CONTENT
        // =================================================

        complaintDetails.innerHTML = `

            <p>
                <strong>
                    Complaint ID:
                </strong>

                ${complaint.id}
            </p>


            <p>
                <strong>
                    Complaint:
                </strong>

                ${complaint.description || complaint.title}
            </p>


            <p>
                <strong>
                    Category:
                </strong>

                ${complaint.category}
            </p>


            <p>
                <strong>
                    Location:
                </strong>

                ${complaint.location}
            </p>


            <p>
                <strong>
                    Priority:
                </strong>

                ${complaint.priority}
            </p>


            <p>
                <strong>
                    Status:
                </strong>

                <span
                    class="complaint-status status-${complaint.status
                        .toLowerCase()
                        .replace(/\s+/g, "-")}"
                >
                    ${complaint.status}
                </span>
            </p>


            ${statusProgress}


            <p>
                <strong>
                    Submitted:
                </strong>

                ${submittedTime}
            </p>


            <p>
                <strong>
                    Last Updated:
                </strong>

                ${updatedTime}
            </p>


            ${
                complaint.image
                ?
                `
                <p>
                    <strong>
                        Uploaded Image:
                    </strong>
                </p>

                <img
                    src="http://127.0.0.1:5000/uploads/${complaint.image}"
                    alt="Complaint Image"
                    class="complaint-modal-image"
                >
                `
                :
                ""
            }

        `;


        // =================================================
        // OPEN MODAL
        // =================================================

        complaintModal.style.display =
            "block";


        console.log(
            "Complaint modal opened"
        );

    }



    // =====================================================
    // CLOSE MODAL
    // =====================================================

    const closeComplaintModal =
        document.getElementById(
            "closeComplaintModal"
        );


    if (closeComplaintModal) {

        closeComplaintModal.addEventListener(
            "click",
            function () {

                const complaintModal =
                    document.getElementById(
                        "complaintModal"
                    );


                if (complaintModal) {

                    complaintModal.style.display =
                        "none";

                }

            }
        );

    }



    // =====================================================
    // CLOSE MODAL WHEN CLICKING OUTSIDE
    // =====================================================

    const complaintModal =
        document.getElementById(
            "complaintModal"
        );


    if (complaintModal) {

        complaintModal.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    complaintModal
                ) {

                    complaintModal.style.display =
                        "none";

                }

            }
        );

    }



    // =====================================================
    // LOAD COMPLAINTS
    // =====================================================

    loadMyComplaints();

</script>

</body>

</html>
